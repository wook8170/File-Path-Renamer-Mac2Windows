<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>File Path Renamer</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f7f5;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f7f7f5;
      }

      body {
        display: flex;
      }

      #app {
        flex: 1;
        min-height: 100vh;
      }

      .boot-shell {
        box-sizing: border-box;
        display: flex;
        min-height: 100vh;
        width: 100%;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(circle at top left, rgba(125, 211, 252, 0.18), transparent 36%),
          radial-gradient(circle at bottom right, rgba(196, 181, 253, 0.2), transparent 34%),
          #f7f7f5;
      }

      .boot-card {
        width: min(460px, 100%);
        border-radius: 24px;
        border: 1px solid rgba(214, 211, 209, 0.9);
        background: rgba(255, 255, 255, 0.92);
        padding: 28px 30px;
        box-shadow: 0 16px 40px rgba(28, 25, 23, 0.08);
        backdrop-filter: blur(10px);
      }

      .boot-title {
        margin: 0 0 10px;
        font-size: 28px;
        font-weight: 800;
        line-height: 1.15;
        letter-spacing: -0.03em;
        color: #1c1917;
      }

      .boot-copy {
        margin: 0;
        font-size: 14px;
        line-height: 1.6;
        color: #57534e;
      }

      .boot-progress {
        margin-top: 18px;
        height: 7px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(231, 229, 228, 0.95);
      }

      .boot-progress::before {
        content: "";
        display: block;
        height: 100%;
        width: 38%;
        border-radius: inherit;
        background: linear-gradient(90deg, #38bdf8, #818cf8);
        animation: boot-slide 1.35s ease-in-out infinite;
        transform-origin: left center;
      }

      @keyframes boot-slide {
        0% {
          transform: translateX(-110%);
        }
        55% {
          transform: translateX(180%);
        }
        100% {
          transform: translateX(180%);
        }
      }

      @media (prefers-color-scheme: dark) {
        :root,
        html,
        body {
          background: #0f172a;
        }

        .boot-shell {
          background:
            radial-gradient(circle at top left, rgba(56, 189, 248, 0.14), transparent 36%),
            radial-gradient(circle at bottom right, rgba(129, 140, 248, 0.16), transparent 34%),
            #0f172a;
        }

        .boot-card {
          border-color: rgba(71, 85, 105, 0.7);
          background: rgba(30, 41, 59, 0.9);
          box-shadow: 0 18px 44px rgba(2, 6, 23, 0.34);
        }

        .boot-title {
          color: #f8fafc;
        }

        .boot-copy {
          color: #cbd5e1;
        }

        .boot-progress {
          background: rgba(51, 65, 85, 0.9);
        }
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app">
      <div class="boot-shell" aria-hidden="true">
        <div class="boot-card">
          <h1 class="boot-title">File Path Renamer</h1>
          <p class="boot-copy">앱을 준비하는 중입니다. 첫 화면을 불러오고 있어요.</p>
          <div class="boot-progress"></div>
        </div>
      </div>
    </div>
  </body>
</html>
